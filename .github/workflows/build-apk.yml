name: 构建 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 设置 Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装项目依赖
        run: npm install

      - name: 构建前端静态资源
        run: npx vite build

      - name: 安装 Capacitor 依赖并初始化 Android 原生工程
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Gemini 智能助手" "com.gemini.chatassistant" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 为 Gradle 赋予可执行权限并编译 Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 上传编译好的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Chat-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
